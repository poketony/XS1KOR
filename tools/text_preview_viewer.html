<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>XS1 Text Preview</title>
  <style>
    :root {
      --bg: #101214;
      --panel: #181b1f;
      --panel2: #20242a;
      --text: #e7e9ed;
      --muted: #a8b0bb;
      --line: #343a43;
      --warn: #ff6666;
      --accent: #8bd5ff;
      --over: #3a2024;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, "Malgun Gothic", sans-serif;
      font-size: 14px;
    }

    main {
      max-width: 1180px;
      margin: 0 auto;
      padding: 16px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(320px, 1fr) minmax(360px, 1fr);
      gap: 14px;
      align-items: start;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 12px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-bottom: 10px;
    }

    label {
      color: var(--muted);
      display: inline-flex;
      gap: 6px;
      align-items: center;
    }

    input[type="number"] {
      width: 76px;
      background: var(--panel2);
      border: 1px solid var(--line);
      color: var(--text);
      border-radius: 4px;
      padding: 7px 8px;
      font: inherit;
    }

    input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--accent);
    }

    button {
      background: var(--panel2);
      border: 1px solid var(--line);
      color: var(--text);
      border-radius: 4px;
      padding: 7px 10px;
      font: inherit;
      cursor: pointer;
    }

    button:hover { border-color: var(--accent); }

    textarea {
      width: 100%;
      min-height: 460px;
      resize: vertical;
      background: #0b0d0f;
      border: 1px solid var(--line);
      color: var(--text);
      border-radius: 4px;
      padding: 10px;
      font: 15px/1.45 Consolas, "Malgun Gothic", monospace;
      letter-spacing: 0;
    }

    .stats {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      color: var(--muted);
      margin: 0 0 10px;
    }

    .stat strong { color: var(--text); }

    .preview {
      overflow: auto;
      background: #0b0d0f;
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 8px;
      min-height: 420px;
    }

    .row {
      display: grid;
      grid-template-columns: 36px max-content;
      min-height: 25px;
      align-items: stretch;
    }

    .row.over { background: var(--over); }

    .rownum {
      color: var(--muted);
      border-right: 1px solid var(--line);
      padding: 2px 7px 2px 0;
      text-align: right;
      user-select: none;
    }

    .cells {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: var(--cell-size, 26px);
      padding-left: 6px;
    }

    .cell {
      min-width: var(--cell-size, 26px);
      height: 25px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-right: 1px solid rgba(255,255,255,0.08);
      color: var(--text);
      font: var(--cell-font-size, 18px)/1 "Malgun Gothic", monospace;
      letter-spacing: 0;
      white-space: pre;
    }

    .cell.blank { color: #59616d; }
    .cell.fullSpace { color: transparent; }
    .cell.half { background: rgba(255, 102, 102, 0.18); color: #ffd2d2; }
    .cell.badStart { outline: 1px solid var(--warn); outline-offset: -1px; }

    .warnings {
      margin-top: 10px;
      color: var(--warn);
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .ok {
      margin-top: 10px;
      color: #8fe388;
    }

    .hint {
      color: var(--muted);
      margin-top: 8px;
      line-height: 1.45;
    }

    @media (max-width: 840px) {
      .layout { grid-template-columns: 1fr; }
      textarea { min-height: 300px; }
    }
  </style>
</head>
<body>
  <main>
    <h1>XS1 Text Preview</h1>
    <div class="layout">
      <section class="panel">
        <div class="controls">
          <label>행 끊기
            <input id="widthInput" type="number" min="1" max="80" value="12">
          </label>
          <button id="preset12" type="button">12</button>
          <button id="preset23" type="button">23</button>
          <label><input id="autoExtract" type="checkbox" checked> 레코드 접두부 제거</label>
        </div>
        <textarea id="source" spellcheck="false" placeholder="OV10 Help 문자열이나 card.txt effect를 붙여 넣으십시오."></textarea>
        <div class="hint">
          {CTRL0C:c8 08 08|○}는 ○로 표시하고, {BYTE:00}, {0B0D00}, {CTRL:...} 같은 제어코드는 표시 폭에서 제외합니다.
        </div>
      </section>

      <section class="panel">
        <div class="stats">
          <span class="stat">폭 <strong id="widthStat">12</strong></span>
          <span class="stat">최대 행 <strong id="rowLimitStat">15</strong></span>
          <span class="stat">표시 글자 <strong id="charCount">0</strong></span>
          <span class="stat">사용 행 <strong id="lineCount">0</strong></span>
        </div>
        <div id="preview" class="preview" aria-live="polite"></div>
        <div id="messages"></div>
      </section>
    </div>
  </main>

  <script>
    const source = document.getElementById("source");
    const widthInput = document.getElementById("widthInput");
    const autoExtract = document.getElementById("autoExtract");
    const preview = document.getElementById("preview");
    const messages = document.getElementById("messages");
    const widthStat = document.getElementById("widthStat");
    const rowLimitStat = document.getElementById("rowLimitStat");
    const charCount = document.getElementById("charCount");
    const lineCount = document.getElementById("lineCount");

    document.getElementById("preset12").addEventListener("click", () => {
      widthInput.value = "12";
      render();
    });
    document.getElementById("preset23").addEventListener("click", () => {
      widthInput.value = "23";
      render();
    });

    source.addEventListener("input", render);
    widthInput.addEventListener("input", render);
    autoExtract.addEventListener("change", render);
    window.addEventListener("resize", render);

    function rowLimitFor(width) {
      if (width === 12) return 15;
      if (width === 23) return 4;
      return 12;
    }

    function nthPipeIndex(text, count) {
      let at = -1;
      for (let i = 0; i < count; i += 1) {
        at = text.indexOf("|", at + 1);
        if (at < 0) return -1;
      }
      return at;
    }

    function extractRecordText(raw) {
      if (!autoExtract.checked) return raw;
      return raw.split(/\r?\n/).map((line) => {
        if (line.startsWith("S|")) {
          const at = nthPipeIndex(line, 4);
          return at >= 0 ? line.slice(at + 1) : line;
        }
        if (line.startsWith("N|")) {
          const at = nthPipeIndex(line, 5);
          return at >= 0 ? line.slice(at + 1) : line;
        }
        const card = line.match(/^\d{1,3}\t(?:name|effect|quote)\t(.*)$/);
        if (card) return card[1];
        const oldOv = line.match(/^[0-9a-fA-F]{8}\|[^|]*\|(.*)$/);
        if (oldOv) return oldOv[1];
        return line;
      }).join("\n");
    }

    function stripControls(text) {
      return text
        .replace(/\{CTRL0C:[^|}]*\|([^}]*)\}/gi, "$1")
        .replace(/\{(?:BYTE|CTRL):[^}]*\}/gi, "")
        .replace(/\{0B0D00\}|\{0D0[024]\}/gi, "")
        .replace(/\\x[0-9a-fA-F]{2}/g, "")
        .replace(/\\r\\n|\\r|\\n/g, "\n")
        .replace(/\{[^}]*\}/g, "");
    }

    function isHalfWidth(ch) {
      const code = ch.codePointAt(0);
      return (code >= 0x20 && code <= 0x7e) || (code >= 0xff61 && code <= 0xff9f);
    }

    function isBadLineStart(ch) {
      return ch === "　" || "，．。：；？！）」』〕〉》、,.?:;!)]}/".includes(ch);
    }

    function wrapText(text, width) {
      const rows = [];
      const hardLines = text.split("\n");
      hardLines.forEach((line, hardIndex) => {
        if (line.length === 0) {
          rows.push("");
        } else {
          for (let i = 0; i < line.length; i += width) {
            rows.push(line.slice(i, i + width));
          }
        }
        if (hardIndex !== hardLines.length - 1 && line.length !== 0) {
          rows.push("");
        }
      });
      return rows;
    }

    function render() {
      const width = Math.max(1, Math.min(80, Number(widthInput.value) || 12));
      if (String(width) !== widthInput.value) widthInput.value = String(width);
      const maxRows = rowLimitFor(width);
      const availableWidth = Math.max(240, preview.clientWidth - 54);
      const baseCellSize = width === 23 ? 22 : 26;
      const fittedCellSize = width === 23
        ? Math.max(13, Math.min(baseCellSize, Math.floor(availableWidth / width)))
        : baseCellSize;
      preview.style.setProperty("--cell-size", `${fittedCellSize}px`);
      preview.style.setProperty("--cell-font-size", `${Math.max(12, Math.min(18, fittedCellSize - 2))}px`);
      const raw = source.value;
      const text = stripControls(extractRecordText(raw));
      const rows = wrapText(text, width);
      const warnings = [];
      const halfChars = [];
      const badStarts = [];

      for (let i = 0; i < text.length; i += 1) {
        const ch = text[i];
        if (ch !== "\n" && isHalfWidth(ch)) halfChars.push({ ch, pos: i + 1 });
      }

      rows.forEach((row, index) => {
        if (row && isBadLineStart(row[0])) badStarts.push(index + 1);
      });

      if (halfChars.length) {
        const shown = halfChars.slice(0, 12).map((x) => `${x.ch}@${x.pos}`).join(", ");
        warnings.push(`반각 문자가 있습니다: ${shown}${halfChars.length > 12 ? " ..." : ""}`);
      }
      if (rows.length > maxRows) {
        warnings.push(`칸 초과: ${width}x${maxRows}=${width * maxRows}칸, 현재 ${rows.length}행/${text.replace(/\n/g, "").length}글자`);
      }
      if (badStarts.length) {
        warnings.push(`줄 첫 글자가 공백 또는 문장부호입니다: ${badStarts.join(", ")}행`);
      }

      widthStat.textContent = width;
      rowLimitStat.textContent = maxRows;
      charCount.textContent = String(text.replace(/\n/g, "").length);
      lineCount.textContent = String(rows.length);

      const frag = document.createDocumentFragment();
      const drawRows = rows.length ? rows : [""];
      drawRows.forEach((row, rowIndex) => {
        const rowEl = document.createElement("div");
        rowEl.className = "row" + (rowIndex >= maxRows ? " over" : "");

        const num = document.createElement("div");
        num.className = "rownum";
        num.textContent = String(rowIndex + 1).padStart(2, "0");
        rowEl.appendChild(num);

        const cells = document.createElement("div");
        cells.className = "cells";
        for (let i = 0; i < width; i += 1) {
          const ch = row[i] || "";
          const cell = document.createElement("div");
          cell.className = "cell";
          if (!ch) {
            cell.classList.add("blank");
            cell.textContent = "·";
          } else {
            if (ch === "　") cell.classList.add("fullSpace");
            if (isHalfWidth(ch)) cell.classList.add("half");
            if (i === 0 && isBadLineStart(ch)) cell.classList.add("badStart");
            cell.textContent = ch;
          }
          cells.appendChild(cell);
        }
        rowEl.appendChild(cells);
        frag.appendChild(rowEl);
      });

      preview.replaceChildren(frag);
      if (warnings.length) {
        messages.className = "warnings";
        messages.textContent = warnings.join("\n");
      } else {
        messages.className = "ok";
        messages.textContent = "경고 없음";
      }
    }

    render();
  </script>
</body>
</html>
